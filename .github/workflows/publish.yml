name: ci

# 빌드·테스트: 모든 push / PR.
# npm 게시: v* 태그 푸시 시에만(예: v0.1.0).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  publish:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing(OIDC) 필수 — NPM_TOKEN 시크릿 불필요
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # npm trusted publishing 은 npm CLI >=11.5.1 요구
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish --access public
