name: ci

# 빌드·테스트: 모든 push / PR.
# npm 게시: v* 태그 푸시 시에만(예: v0.1.0).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# 최소 권한 기본값. 필요한 job 이 자기 블록에서 올려 받는다(publish 의 id-token).
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  publish:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # 게시 승인 게이트. GitHub Settings > Environments > npm-publish 에
    # required reviewer 를 지정하면 태그가 밀려도 승인 전까지 이 job 이 멈춘다.
    # reviewer 미지정 상태에서는 아무 제약 없이 통과한다(넣어둬도 무해).
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # trusted publishing(OIDC) 필수 — NPM_TOKEN 시크릿 불필요
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # npm trusted publishing 은 npm CLI >=11.5.1 요구
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci

      # 태그와 package.json 버전이 어긋나면 npm 은 package.json 버전으로 게시되는데
      # server.json 은 태그 버전을 주장하게 된다 — 레지스트리 검증이 깨지므로 먼저 막는다.
      - name: 태그 = package.json 버전 확인
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF#refs/tags/}"

      - run: npm publish --access public

      # MCP 레지스트리 등재. 네임스페이스가 com.goldpopcon/* 이라 DNS 인증을 쓴다
      # (GitHub 인증은 io.github.<계정|org>/* 만 주는데, org 네임스페이스가 열리지 않았다).
      # 도메인 소유 증명은 goldpopcon.com 의 TXT 레코드 v=MCPv1; k=ed25519; p=<공개키>.
      - name: mcp-publisher 설치
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: server.json 버전을 태그에 맞춤
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
      - run: ./mcp-publisher login dns --domain goldpopcon.com --private-key "${{ secrets.MCP_PRIVATE_KEY }}"
      - run: ./mcp-publisher publish
